name: Build Release APK and AAB

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '\r' | grep -v '^-' | tr -d '\n ' | base64 --decode > release-keystore.jks

      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=../release-keystore.jks" > key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> key.properties
          echo "keyAlias=$KEY_ALIAS" >> key.properties
          echo "keyPassword=$KEY_PASSWORD" >> key.properties

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease

      - name: Extract Version Name
        id: get_version
        run: |
          VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F '"' '{print $2}')
          echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "Extracted Version: $VERSION_NAME"

      - name: Rename and Prepare Artifacts
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          mkdir -p outputs
          cp app/build/outputs/apk/release/app-release.apk outputs/Callyn_v$VERSION.apk
          cp app/build/outputs/bundle/release/app-release.aab outputs/Callyn_v$VERSION.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Callyn_v${{ steps.get_version.outputs.version }}_apk
          path: outputs/Callyn_v${{ steps.get_version.outputs.version }}.apk

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Callyn_v${{ steps.get_version.outputs.version }}_aab
          path: outputs/Callyn_v${{ steps.get_version.outputs.version }}.aab
